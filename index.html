<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>月见 · 三个女朋友</title>
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css?v=1.4.0">
  <link rel="stylesheet" href="css/mobile.css?v=1.4.0">
</head>
<body>

<!-- 壁纸层（随主题切换 light/harbor） -->
<div id="wall"></div>

<div class="app" id="app">

  <!-- ════ 顶栏 ════ -->
  <header id="top-bar">
    <button class="gf-info" id="gf-info" title="查看她的主页">
      <img class="gf-avatar" id="top-avatar" src="assets/avatar.png" alt="">
      <div class="gf-meta">
        <div class="gf-name" id="top-name">苏晚晚</div>
        <div class="gf-status" id="top-status"><span class="status-dot"></span><span id="top-status-text">在线</span></div>
      </div>
    </button>
    <div class="top-actions">
      <button class="icon-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="api-btn" title="API Key" aria-label="API Key">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
      </button>
      <button class="icon-btn" id="menu-btn" title="菜单" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </header>

  <div class="main-layout" id="main-layout">

    <!-- ════ 侧栏：三位女友列表（桌面端） ════ -->
    <aside id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">🌙</div>
        <div class="sidebar-brand-text">
          <div class="brand-title">月见</div>
          <div class="brand-sub">Moonveil · 三个女朋友</div>
        </div>
      </div>
      <div class="sidebar-section-title">我的女友</div>
      <div id="gf-list"><!-- 由 js 渲染三位女友卡片 --></div>
      <div class="sidebar-footer">
        <div class="sidebar-footer-row" id="api-status-row">
          <span id="api-status-text">API Key 未配置</span>
        </div>
        <div class="sidebar-footer-row" id="backend-status-row">
          <span id="backend-status-line">🔗 记忆后端：未连接</span>
        </div>
        <div class="sidebar-footer-row dim">v<span id="version-text">1.0.0</span></div>
      </div>
    </aside>

    <!-- ════ 主聊天区 ════ -->
    <main id="chat-main">
      <section id="chat-view" class="view active">
        <div id="dialogue-area">
          <!-- 消息气泡由 js 渲染 -->
          <div class="msg system" id="chat-placeholder">
            <div class="msg-text">点开左侧的女友开始聊天吧</div>
          </div>
        </div>
        <div class="input-area">
          <textarea id="player-input" rows="1" placeholder="写点什么吧…"></textarea>
          <button id="send-btn">发送</button>
        </div>
      </section>
    </main>

  </div>

  <!-- ════ 移动端底部导航：三位女友 tab ════ -->
  <nav id="mobile-bottom-nav">
    <!-- 由 js 渲染三个女友 tab -->
  </nav>

</div>

<!-- ════ 个人主页 ════ -->
<div id="profile-overlay" class="overlay hidden"></div>
<div id="profile-panel" class="profile-panel hidden">
  <button class="profile-close" id="profile-close" aria-label="关闭">✕</button>
  <div class="profile-header">
    <img class="profile-avatar" id="profile-avatar" src="" alt="">
    <div class="profile-name" id="profile-name"></div>
    <div class="profile-tag" id="profile-tag"></div>
    <div class="profile-signature" id="profile-signature"></div>
  </div>
  <div class="profile-body" id="profile-body"><!-- 信息卡由 js 渲染 --></div>
</div>

<!-- ════ 菜单面板 ════ -->
<div id="menu-overlay" class="overlay hidden"></div>
<div id="menu-panel" class="panel hidden">
  <div class="menu-art"></div>
  <div class="panel-title">菜单</div>
  <button class="menu-item" id="menu-theme"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg></span>主题：珍珠潮汐</button>
  <button class="menu-item" id="menu-monitor"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v3M12 10v8M17 6v12"/></svg></span>记忆监视</button>
  <button class="menu-item" id="menu-update"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg></span>检查更新</button>
  <button class="menu-item" id="menu-backup"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></svg></span>存档管理</button>
  <button class="menu-item" id="menu-api"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg></span>设置 API Key</button>
  <button class="menu-item danger" id="menu-clear"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6"/><path d="M10 11v6M14 11v6"/></svg></span>清空当前对话</button>
  <div class="menu-item dim">v<span id="menu-version">1.0.0</span></div>
</div>

<!-- ════ API Key 弹窗 ════ -->
<div id="api-modal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-title">配置 DeepSeek API Key</div>
    <p class="modal-desc">三位女友的对话由 DeepSeek 大模型实时生成。Key 只保存在你的浏览器本地，不会上传到任何服务器。<br>可选：填写 EbbingFlow 记忆后端地址，把长期记忆交给它管理（留空则使用内置记忆）。</p>
    <!-- type=text + text-security：Android 不触发安全键盘（方便粘贴 API Key），仍以圆点遮挡 -->
    <label class="modal-field-label" for="api-key-input">DeepSeek API Key</label>
    <input type="text" id="api-key-input" placeholder="sk-..." autocomplete="off" spellcheck="false" style="-webkit-text-security: disc;">
    <label class="modal-field-label" for="memory-backend-input">记忆后端（可选）</label>
    <input type="text" id="memory-backend-input" placeholder="如 http://localhost:8000，留空用内置记忆" autocomplete="off" spellcheck="false">
    <div class="backend-connect-row">
      <button class="btn secondary" id="backend-connect-btn">🔗 连接后端</button>
      <button class="btn secondary" id="backend-disconnect-btn">断开</button>
      <span id="backend-status-text" class="backend-status"></span>
    </div>
    <div class="modal-buttons">
      <button class="btn secondary" id="api-skip-btn">跳过</button>
      <button class="btn primary" id="api-save-btn">保存</button>
    </div>
  </div>
</div>

<!-- ════ 检查更新弹窗 ════ -->
<div id="update-overlay" class="modal-overlay hidden"></div>
<div id="update-modal" class="modal hidden">
  <div class="modal-title">发现新版本 ✨</div>
  <p class="modal-desc" id="update-desc" style="white-space: pre-line;"></p>
  <div class="modal-buttons">
    <button class="btn secondary" id="update-copy-btn">📋 复制下载链接</button>
    <button class="btn secondary" id="update-cancel-btn">稍后再说</button>
    <button class="btn primary" id="update-download-btn">前往下载</button>
  </div>
</div>

<!-- ════ 存档管理 ════ -->
<div id="backup-overlay" class="modal-overlay hidden"></div>
<div id="backup-modal" class="modal hidden">
  <div class="modal-title">存档管理</div>
  <p class="modal-desc">聊天记录保存在本机，升级 App 不会丢失。建议定期导出备份——换机或卸载前先导出一份。</p>
  <div class="modal-buttons" style="justify-content: flex-start;">
    <button class="btn primary" id="backup-export-btn">⬇️ 生成存档</button>
    <button class="btn secondary" id="backup-import-btn">⬆️ 导入存档</button>
    <input type="file" id="backup-file-input" accept="application/json,.json" style="display:none">
  </div>
  <textarea id="backup-output" class="backup-output hidden" readonly placeholder="点「生成存档」后这里会出现存档内容，可复制保存"></textarea>
  <button class="btn secondary" id="backup-copy-btn" style="display:none; width: 100%; margin-top: 10px;">📋 复制存档</button>
</div>

<!-- ════ 记忆监视（EbbingFlow Data Monitor 内嵌） ════ -->
<div id="monitor-overlay" class="overlay hidden"></div>
<div id="monitor-panel" class="monitor-panel hidden">
  <div class="monitor-bar">
    <span class="monitor-title">📊 记忆监视 · EbbingFlow</span>
    <button class="profile-close" id="monitor-close" aria-label="关闭">✕</button>
  </div>
  <iframe id="monitor-frame" src="" title="记忆监视"></iframe>
</div>

<!-- ════ 轻提示 ════ -->
<div id="toast" class="hidden"></div>

<script src="js/version.js?v=1.4.0"></script>
<script src="js/data.js?v=1.4.0"></script>
<script src="js/app.js?v=1.4.0"></script>
</body>
</html>
